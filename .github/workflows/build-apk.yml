name: Build APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Диагностика: при падении выносит строки ошибок в аннотации запуска.
      # Шаг не ослабляет проверку: сборка остаётся упавшей.
      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not |Unresolved|FAILURE|Caused by" build.log \
                | head -40 | cut -c1-400 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Gradle errors::${msg}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorMusic-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
